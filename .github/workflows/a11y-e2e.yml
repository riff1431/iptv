name: Accessibility E2E

on:
  push:
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('.github/workflows/a11y-e2e.yml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi


      - name: Start dev server
        run: |
          mkdir -p /tmp/devserver
          nohup bun run dev > /tmp/devserver/dev.log 2>&1 &
          echo $! > .devserver.pid
          echo "Dev server started with PID $(cat .devserver.pid)"

      - name: Wait for dev server to be ready
        run: |
          set -euo pipefail
          HOST=localhost
          PORT=8080
          URL="http://${HOST}:${PORT}/"
          DEADLINE=$(( $(date +%s) + 120 ))
          echo "Waiting for dev server at ${URL} (timeout 120s)..."
          while :; do
            # 1) process still alive
            if [ -f .devserver.pid ] && ! kill -0 "$(cat .devserver.pid)" 2>/dev/null; then
              echo "::error::Dev server process exited before becoming ready"
              tail -n 200 /tmp/devserver/dev.log || true
              exit 1
            fi
            # 2) TCP port open
            if (echo > "/dev/tcp/${HOST}/${PORT}") >/dev/null 2>&1; then
              # 3) HTTP responds with 2xx/3xx
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${URL}" || echo "000")
              if [ "${code}" -ge 200 ] && [ "${code}" -lt 400 ]; then
                echo "Dev server is ready (HTTP ${code})"
                break
              fi
              echo "Port open, awaiting HTTP 2xx/3xx (got ${code})"
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::Dev server failed to become ready within 120s"
              tail -n 200 /tmp/devserver/dev.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run accessibility E2E test
        run: python tests/e2e/home_a11y_focus_reduced_motion.py


      - name: Stop dev server
        if: always()
        run: |
          if [ -f .devserver.pid ]; then
            kill "$(cat .devserver.pid)" || true
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenshots
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenshots
          path: |
            tests/e2e/screenshots/**
            /tmp/browser/**
            /tmp/devserver/dev.log
          if-no-files-found: ignore

