name: Admin Route Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('.github/workflows/admin-smoke.yml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Start dev server
        run: |
          mkdir -p /tmp/devserver
          nohup bun run dev > /tmp/devserver/dev.log 2>&1 &
          echo $! > .devserver.pid

      - name: Wait for dev server
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 120 ))
          while :; do
            if [ -f .devserver.pid ] && ! kill -0 "$(cat .devserver.pid)" 2>/dev/null; then
              echo "::error::Dev server exited"; tail -n 200 /tmp/devserver/dev.log; exit 1
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/ || echo 000)
            if [ "${code}" -ge 200 ] && [ "${code}" -lt 400 ]; then break; fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::Dev server not ready in 120s"; tail -n 200 /tmp/devserver/dev.log; exit 1
            fi
            sleep 2
          done

      - name: Run /admin smoke test
        run: python tests/e2e/admin_route_smoke.py

      - name: Stop dev server
        if: always()
        run: '[ -f .devserver.pid ] && kill "$(cat .devserver.pid)" || true'

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-smoke-artifacts
          path: |
            /tmp/browser/admin-smoke/**
            /tmp/devserver/dev.log
          if-no-files-found: ignore
