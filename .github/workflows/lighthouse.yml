name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---------- BASELINE (target branch, PR only) ----------
      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD -- .

      - name: Install dependencies (base)
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Build (base)
        if: github.event_name == 'pull_request'
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Run Lighthouse (base)
        if: github.event_name == 'pull_request'
        run: |
          bunx --bun @lhci/cli@0.14.x autorun --config=.lighthouserc.json || true
          mkdir -p lhci-base
          cp -r .lighthouseci/* lhci-base/ 2>/dev/null || true
          rm -rf .lighthouseci

      # ---------- HEAD (PR branch / push) ----------
      - name: Restore PR head
        if: github.event_name == 'pull_request'
        run: git checkout ${{ github.event.pull_request.head.sha }} -- .

      - name: Reinstall dependencies (head)
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Build (head)
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Run Lighthouse (head)
        run: bunx --bun @lhci/cli@0.14.x autorun --config=.lighthouserc.json

      # ---------- TREND ----------
      - name: Compare scores and build summary
        if: always()
        run: node scripts/lhci-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            lhci-base
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse
          path: lhci-summary.md
